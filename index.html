<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作業與踩地雷遊戲 - 陳渝媗</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang TC", "Microsoft JhengHei", sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 50%, #cbd5e1 100%);
      color: #1e293b;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px 50px;
    }

    /* 頂部作業卡片 (學生姓名與台北時間) */
    .top-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 24px 32px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
      max-width: 540px;
      width: 100%;
      text-align: center;
      margin-bottom: 24px;
      border: 1px solid #f1f5f9;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #2563eb;
      background-color: #eff6ff;
      border: 1px solid #dbeafe;
      padding: 4px 14px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .name-title {
      font-size: 0.85rem;
      color: #64748b;
      margin-bottom: 2px;
    }

    .student-name {
      font-size: 1.9rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: 1.5px;
      margin-bottom: 14px;
    }

    /* 台北即時時鐘 */
    .clock-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 12px 18px;
    }

    .clock-title {
      font-size: 0.8rem;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      margin-bottom: 4px;
    }

    .date-text {
      font-size: 0.95rem;
      color: #334155;
      font-weight: 500;
    }

    .time-text {
      font-size: 1.8rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: #1e3a8a;
      letter-spacing: 1px;
      margin: 2px 0;
    }

    .timezone-label {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    /* ================================================= */
    /* 踩地雷遊戲主容器                                   */
    /* ================================================= */
    .game-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.1);
      max-width: 640px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid #f1f5f9;
    }

    .game-header-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.3rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 16px;
    }

    /* 難度選擇與操作控制列 */
    .control-panel {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      width: 100%;
    }

    .select-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color: #475569;
      font-weight: 600;
    }

    .difficulty-select {
      appearance: none;
      background: #f8fafc url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E") no-repeat right 12px center;
      border: 1px solid #cbd5e1;
      padding: 8px 36px 8px 14px;
      font-size: 0.9rem;
      border-radius: 10px;
      color: #1e293b;
      cursor: pointer;
      font-weight: 500;
      outline: none;
      transition: all 0.2s;
    }

    .difficulty-select:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    /* 插旗切換按鈕 (便於觸控或滑鼠) */
    .flag-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      font-size: 0.88rem;
      font-weight: 600;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #475569;
      cursor: pointer;
      transition: all 0.2s;
    }

    .flag-toggle-btn.active {
      background: #fee2e2;
      border-color: #fca5a5;
      color: #dc2626;
      box-shadow: 0 2px 6px rgba(220, 38, 38, 0.15);
    }

    /* 踩地雷面板頂部儀表板 (雷數、笑臉按鈕、計時器) */
    .dashboard {
      background: #1e293b;
      border-radius: 14px;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 480px;
      margin-bottom: 16px;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .digital-lcd {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #ef4444;
      font-family: "Courier New", Courier, monospace, monospace;
      font-size: 1.6rem;
      font-weight: 900;
      padding: 4px 12px;
      letter-spacing: 3px;
      min-width: 84px;
      text-align: center;
      text-shadow: 0 0 8px rgba(239, 68, 68, 0.6);
    }

    .reset-btn {
      font-size: 1.8rem;
      background: #f8fafc;
      border: 2px solid #cbd5e1;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
      box-shadow: 0 3px 6px rgba(0,0,0,0.2);
    }

    .reset-btn:hover {
      transform: scale(1.08);
      background: #ffffff;
    }

    .reset-btn:active {
      transform: scale(0.95);
    }

    /* 棋盤區域 */
    .board-scroll-area {
      max-width: 100%;
      overflow: auto;
      padding: 8px;
      display: flex;
      justify-content: center;
    }

    .minesweeper-board {
      display: grid;
      gap: 3px;
      background: #94a3b8;
      padding: 8px;
      border-radius: 12px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12), inset 0 2px 4px rgba(0, 0, 0, 0.15);
    }

    /* 踩地雷格子 */
    .cell {
      width: 32px;
      height: 32px;
      background: #e2e8f0;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.05rem;
      cursor: pointer;
      box-shadow: inset 2px 2px 0px #ffffff, inset -2px -2px 0px #cbd5e1;
      transition: background-color 0.1s;
    }

    .cell:hover:not(.revealed) {
      background: #f1f5f9;
    }

    .cell.revealed {
      background: #f8fafc;
      box-shadow: inset 1px 1px 2px rgba(0, 0, 0, 0.1);
      cursor: default;
    }

    .cell.mine-hit {
      background: #ef4444 !important;
      color: #ffffff;
    }

    .cell.flagged {
      color: #ef4444;
    }

    /* 數字顏色 (經典設定) */
    .c-1 { color: #2563eb; }
    .c-2 { color: #16a34a; }
    .c-3 { color: #dc2626; }
    .c-4 { color: #4338ca; }
    .c-5 { color: #b91c1c; }
    .c-6 { color: #0891b2; }
    .c-7 { color: #0f172a; }
    .c-8 { color: #64748b; }

    /* 遊戲狀態提示與重來按鈕 */
    .game-status-bar {
      margin-top: 16px;
      text-align: center;
      width: 100%;
    }

    .status-message {
      font-size: 0.95rem;
      font-weight: 600;
      color: #475569;
      margin-bottom: 12px;
      min-height: 24px;
    }

    .restart-btn {
      background: #2563eb;
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      padding: 10px 24px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2);
      transition: all 0.2s;
    }

    .restart-btn:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(37, 99, 235, 0.3);
    }

    .restart-btn:active {
      transform: translateY(0);
    }

    .tips-text {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 14px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <!-- 頂部資訊卡片 -->
  <header class="top-card">
    <div class="badge">📘 物聯網課程作業</div>
    <div class="name-title">學生姓名</div>
    <h1 class="student-name">陳渝媗</h1>

    <!-- 台北時區時鐘 -->
    <div class="clock-box">
      <div class="clock-title">
        <span>🕒</span>
        <span>當前時間 (即時更新)</span>
      </div>
      <div class="date-text" id="dateText">載入中...</div>
      <div class="time-text" id="timeText">--:--:--</div>
      <div class="timezone-label">時區：台北標準時間 (Asia/Taipei · UTC+8)</div>
    </div>
  </header>

  <!-- 踩地雷遊戲主體 -->
  <main class="game-card">
    <div class="game-header-title">
      <span>💣</span>
      <span>經典踩地雷</span>
    </div>

    <!-- 難度設定與操作切換 -->
    <div class="control-panel">
      <div class="select-wrapper">
        <label for="difficultySelect">難度：</label>
        <select id="difficultySelect" class="difficulty-select">
          <option value="easy">初階 (9 × 9，10 顆雷)</option>
          <option value="medium">中階 (12 × 12，20 顆雷)</option>
          <option value="hard">高階 (16 × 16，40 顆雷)</option>
        </select>
      </div>

      <button id="flagModeBtn" class="flag-toggle-btn" title="切換左鍵點擊為插旗模式（方便筆電觸控板）">
        <span>🚩</span>
        <span id="flagModeText">插旗模式：關</span>
      </button>
    </div>

    <!-- 遊戲儀表板 -->
    <div class="dashboard">
      <div class="digital-lcd" id="mineCounter" title="剩餘地雷數">010</div>
      <button class="reset-btn" id="faceBtn" title="重新開始">😊</button>
      <div class="digital-lcd" id="timerDisplay" title="經過秒數">000</div>
    </div>

    <!-- 踩地雷棋盤滾動區 -->
    <div class="board-scroll-area">
      <div id="board" class="minesweeper-board"></div>
    </div>

    <!-- 遊戲狀態與重來按鈕 -->
    <div class="game-status-bar">
      <div class="status-message" id="statusMessage">點擊任意方格開始探險！</div>
      <button class="restart-btn" id="restartBtn">
        <span>🔄</span>
        <span>重新開始遊戲</span>
      </button>
      <div class="tips-text">
        💡 操作提示：點擊滑鼠左鍵翻開方格，點擊滑鼠右鍵（或開啟「插旗模式」）插旗標記地雷。<br>
        首點絕對安全，不會第一下就踩到地雷！
      </div>
    </div>
  </main>

  <script>
    /* ======================================================== */
    /* 1. 台北時區時鐘                                          */
    /* ======================================================== */
    function updateTaipeiTime() {
      const now = new Date();

      const dateOptions = {
        timeZone: 'Asia/Taipei',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        weekday: 'long'
      };

      const timeOptions = {
        timeZone: 'Asia/Taipei',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      };

      const dateString = new Intl.DateTimeFormat('zh-TW', dateOptions).format(now);
      const timeString = new Intl.DateTimeFormat('zh-TW', timeOptions).format(now);

      document.getElementById('dateText').textContent = dateString;
      document.getElementById('timeText').textContent = timeString;
    }

    updateTaipeiTime();
    setInterval(updateTaipeiTime, 1000);

    /* ======================================================== */
    /* 2. 踩地雷遊戲核心邏輯                                     */
    /* ======================================================== */
    const DIFFICULTIES = {
      easy: { rows: 9, cols: 9, mines: 10 },
      medium: { rows: 12, cols: 12, mines: 20 },
      hard: { rows: 16, cols: 16, mines: 40 }
    };

    let currentDifficulty = 'easy';
    let rows = 9;
    let cols = 9;
    let totalMines = 10;

    let grid = []; // { isMine, neighborMines, isRevealed, isFlagged, element }
    let gameStarted = false;
    let gameOver = false;
    let gameWon = false;
    let flagsUsed = 0;
    let timer = 0;
    let timerInterval = null;
    let flagMode = false; // 用於觸控板或行動裝置切換

    const boardEl = document.getElementById('board');
    const mineCounterEl = document.getElementById('mineCounter');
    const timerDisplayEl = document.getElementById('timerDisplay');
    const faceBtn = document.getElementById('faceBtn');
    const statusMessage = document.getElementById('statusMessage');
    const difficultySelect = document.getElementById('difficultySelect');
    const restartBtn = document.getElementById('restartBtn');
    const flagModeBtn = document.getElementById('flagModeBtn');
    const flagModeText = document.getElementById('flagModeText');

    // 初始化遊戲
    function initGame() {
      // 停止計時器
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = null;
      timer = 0;
      updateTimerDisplay();

      // 重設狀態
      gameStarted = false;
      gameOver = false;
      gameWon = false;
      flagsUsed = 0;
      faceBtn.textContent = '😊';
      statusMessage.textContent = '點擊任意方格開始遊戲！';
      statusMessage.style.color = '#475569';

      const config = DIFFICULTIES[currentDifficulty];
      rows = config.rows;
      cols = config.cols;
      totalMines = config.mines;

      updateMineCounter();

      // 建立網格資料與 DOM
      boardEl.innerHTML = '';
      boardEl.style.gridTemplateColumns = `repeat(${cols}, 32px)`;
      boardEl.style.gridTemplateRows = `repeat(${rows}, 32px)`;

      grid = [];
      for (let r = 0; r < rows; r++) {
        const row = [];
        for (let c = 0; c < cols; c++) {
          const cellEl = document.createElement('div');
          cellEl.className = 'cell';
          cellEl.dataset.row = r;
          cellEl.dataset.col = c;

          // 左鍵點擊
          cellEl.addEventListener('click', (e) => handleCellClick(r, c));
          // 右鍵插旗
          cellEl.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            toggleFlag(r, c);
          });

          boardEl.appendChild(cellEl);

          row.push({
            r,
            c,
            isMine: false,
            neighborMines: 0,
            isRevealed: false,
            isFlagged: false,
            el: cellEl
          });
        }
        grid.push(row);
      }
    }

    // 第一次點擊時才埋地雷 (確保首次點擊必定為安全空地)
    function plantMines(firstR, firstC) {
      const forbidden = new Set();
      // 首次點擊自身及其周圍 8 格盡量不埋雷，確保開局順暢
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          const nr = firstR + dr;
          const nc = firstC + dc;
          if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
            forbidden.add(`${nr},${nc}`);
          }
        }
      }

      // 收集可用候選格子
      const candidates = [];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (!forbidden.has(`${r},${c}`)) {
            candidates.push({ r, c });
          }
        }
      }

      // 如果扣除九宮格後候選數量不足，則僅排除首次點擊的格子
      if (candidates.length < totalMines) {
        candidates.length = 0;
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            if (r !== firstR || c !== firstC) {
              candidates.push({ r, c });
            }
          }
        }
      }

      // 隨機抽取地雷
      for (let i = candidates.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
      }

      for (let i = 0; i < totalMines; i++) {
        const { r, c } = candidates[i];
        grid[r][c].isMine = true;
      }

      // 計算每個格子的相鄰地雷數
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (grid[r][c].isMine) continue;
          let count = 0;
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              const nr = r + dr;
              const nc = c + dc;
              if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && grid[nr][nc].isMine) {
                count++;
              }
            }
          }
          grid[r][c].neighborMines = count;
        }
      }
    }

    // 開始計時
    function startTimer() {
      timer = 0;
      updateTimerDisplay();
      timerInterval = setInterval(() => {
        timer++;
        if (timer > 999) timer = 999;
        updateTimerDisplay();
      }, 1000);
    }

    function updateTimerDisplay() {
      timerDisplayEl.textContent = String(timer).padStart(3, '0');
    }

    function updateMineCounter() {
      const remaining = totalMines - flagsUsed;
      const displayVal = Math.max(-99, Math.min(999, remaining));
      if (displayVal < 0) {
        mineCounterEl.textContent = '-' + String(Math.abs(displayVal)).padStart(2, '0');
      } else {
        mineCounterEl.textContent = String(displayVal).padStart(3, '0');
      }
    }

    // 處理格子點擊
    function handleCellClick(r, c) {
      if (gameOver || gameWon) return;

      const cell = grid[r][c];

      // 若開啟了插旗模式，點擊直接視為插旗
      if (flagMode) {
        toggleFlag(r, c);
        return;
      }

      if (cell.isFlagged || cell.isRevealed) return;

      // 首次點擊處理
      if (!gameStarted) {
        gameStarted = true;
        plantMines(r, c);
        startTimer();
      }

      // 踩到地雷
      if (cell.isMine) {
        triggerGameOver(cell);
        return;
      }

      // 翻開安全格子
      revealCell(r, c);
      checkWinCondition();
    }

    // 翻開格子邏輯 (若相鄰地雷為 0，進行連鎖展開)
    function revealCell(r, c) {
      const cell = grid[r][c];
      if (cell.isRevealed || cell.isFlagged) return;

      cell.isRevealed = true;
      cell.el.classList.add('revealed');

      if (cell.neighborMines > 0) {
        cell.el.textContent = cell.neighborMines;
        cell.el.classList.add(`c-${cell.neighborMines}`);
      } else {
        cell.el.textContent = '';
        // 遞迴翻開周圍 8 格
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            const nr = r + dr;
            const nc = c + dc;
            if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
              revealCell(nr, nc);
            }
          }
        }
      }
    }

    // 切換插旗標記
    function toggleFlag(r, c) {
      if (gameOver || gameWon) return;
      const cell = grid[r][c];
      if (cell.isRevealed) return;

      if (!cell.isFlagged) {
        cell.isFlagged = true;
        cell.el.classList.add('flagged');
        cell.el.textContent = '🚩';
        flagsUsed++;
      } else {
        cell.isFlagged = false;
        cell.el.classList.remove('flagged');
        cell.el.textContent = '';
        flagsUsed--;
      }
      updateMineCounter();
    }

    // 遊戲結束 (踩雷)
    function triggerGameOver(hitCell) {
      gameOver = true;
      clearInterval(timerInterval);
      faceBtn.textContent = '😵';
      statusMessage.textContent = '💥 踩到地雷了！點擊「重新開始」再試一次！';
      statusMessage.style.color = '#dc2626';

      hitCell.el.classList.add('mine-hit');
      hitCell.el.textContent = '💥';

      // 揭開所有未標記的地雷
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const item = grid[r][c];
          if (item.isMine && item !== hitCell) {
            item.el.classList.add('revealed');
            item.el.textContent = '💣';
          } else if (!item.isMine && item.isFlagged) {
            // 標錯旗子顯示叉叉
            item.el.textContent = '❌';
          }
        }
      }
    }

    // 檢查通關
    function checkWinCondition() {
      let unrevealedSafeCells = 0;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const item = grid[r][c];
          if (!item.isMine && !item.isRevealed) {
            unrevealedSafeCells++;
          }
        }
      }

      if (unrevealedSafeCells === 0) {
        gameWon = true;
        clearInterval(timerInterval);
        faceBtn.textContent = '😎';
        statusMessage.textContent = `🎉 恭喜通關！總共耗時 ${timer} 秒！太厲害了！`;
        statusMessage.style.color = '#16a34a';

        // 將所有地雷自動標記為旗子
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const item = grid[r][c];
            if (item.isMine && !item.isFlagged) {
              item.isFlagged = true;
              item.el.classList.add('flagged');
              item.el.textContent = '🚩';
            }
          }
        }
        flagsUsed = totalMines;
        updateMineCounter();
      }
    }

    /* 事件監聽 */
    // 難度切換
    difficultySelect.addEventListener('change', (e) => {
      currentDifficulty = e.target.value;
      initGame();
    });

    // 表情與重開按鈕
    faceBtn.addEventListener('click', initGame);
    restartBtn.addEventListener('click', initGame);

    // 插旗模式按鈕切換
    flagModeBtn.addEventListener('click', () => {
      flagMode = !flagMode;
      if (flagMode) {
        flagModeBtn.classList.add('active');
        flagModeText.textContent = '插旗模式：開';
      } else {
        flagModeBtn.classList.remove('active');
        flagModeText.textContent = '插旗模式：關';
      }
    });

    // 啟動初次載入
    initGame();
  </script>

</body>
</html>
